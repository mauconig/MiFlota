services:
  miflota:
    build: .
    image: miflota:latest
    container_name: miflota
    restart: unless-stopped
    # Solo loopback: el único entrypoint público es Caddy, que además pone el
    # TLS y el basic auth. El puerto 3000 del contenedor nunca se expone a
    # internet directamente.
    ports:
      - '127.0.0.1:8791:3000'
    volumes:
      - miflota-data:/data
    environment:
      MIFLOTA_DB: /data/miflota.db
      MIFLOTA_TIME_ZONE: ${MIFLOTA_TIME_ZONE:-America/Asuncion}
      MIFLOTA_PUSH_ENABLED: ${MIFLOTA_PUSH_ENABLED:-true}
      LOG_LEVEL: info
      # Solo se usan para crear el primer usuario, cuando la tabla está vacía.
      # Después de eso la contraseña vive hasheada en la base y estas variables
      # dejan de tener efecto. Van en un .env que no se versiona.
      MIFLOTA_ADMIN_USER: ${MIFLOTA_ADMIN_USER:?falta MIFLOTA_ADMIN_USER en .env}
      MIFLOTA_ADMIN_PASSWORD: ${MIFLOTA_ADMIN_PASSWORD:?falta MIFLOTA_ADMIN_PASSWORD en .env}
      MIFLOTA_ADMIN_NOMBRE: ${MIFLOTA_ADMIN_NOMBRE:-Dueño}
      # La clave queda del lado del servidor; los clientes nunca la reciben.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-inclusionai/ling-3.0-flash}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      # Cloudinary queda del lado del servidor para almacenar comprobantes.
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-miflota}

volumes:
  miflota-data:
